services:
  ignis:
    image: rlibanez/ignis:dev
    build:
      context: .
      dockerfile: apps/ignis-server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IGNIS_SHARED_RESOURCE_MAX_FILE_MIB: ${IGNIS_SHARED_RESOURCE_MAX_FILE_MIB-8}
      IGNIS_PASSWORD_MIN_LENGTH: ${IGNIS_PASSWORD_MIN_LENGTH:-8}
      IGNIS_PASSWORD_MIN_SPECIAL_CHARS: ${IGNIS_PASSWORD_MIN_SPECIAL_CHARS:-0}
      IGNIS_INITIAL_ADMIN_KEY: ${IGNIS_INITIAL_ADMIN_KEY:-}
      IGNIS_INITIAL_ADMIN_KEY_FILE: ${IGNIS_INITIAL_ADMIN_KEY_FILE:-}
      IGNIS_PUBLIC_ORIGIN: ${IGNIS_PUBLIC_ORIGIN:-http://localhost:8080}
      IGNIS_ALLOW_HTTP_LOOPBACK: ${IGNIS_ALLOW_HTTP_LOOPBACK:-true}
      IGNIS_ALLOW_HTTP_PRIVATE_NETWORK: ${IGNIS_ALLOW_HTTP_PRIVATE_NETWORK:-false}
      IGNIS_TRUSTED_PROXIES: ${IGNIS_TRUSTED_PROXIES:-[]}
      IGNIS_OIDC_ENABLED: ${IGNIS_OIDC_ENABLED:-false}
      IGNIS_OIDC_BUTTON_TEXT: ${IGNIS_OIDC_BUTTON_TEXT:-}
      IGNIS_OIDC_ISSUER: ${IGNIS_OIDC_ISSUER:-}
      IGNIS_OIDC_CLIENT_ID: ${IGNIS_OIDC_CLIENT_ID:-}
      IGNIS_OIDC_CLIENT_SECRET: ${IGNIS_OIDC_CLIENT_SECRET:-}
      IGNIS_OIDC_CLIENT_SECRET_FILE: ${IGNIS_OIDC_CLIENT_SECRET_FILE:-}
      IGNIS_OIDC_AUTO_PROVISION: ${IGNIS_OIDC_AUTO_PROVISION:-false}
      IGNIS_OIDC_ACCOUNT_LINKING: ${IGNIS_OIDC_ACCOUNT_LINKING:-disabled}
      IGNIS_OIDC_ALLOWED_ORIGINS: ${IGNIS_OIDC_ALLOWED_ORIGINS:-[]}
      IGNIS_OIDC_PRIVATE_ADDRESSES: ${IGNIS_OIDC_PRIVATE_ADDRESSES:-}
      IGNIS_OIDC_CA_FILE: ${IGNIS_OIDC_CA_FILE:-}
      # match these to your host user (run: id)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:
