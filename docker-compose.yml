services:
  ignis:
    image: rlibanez/ignis:dev
    build:
      context: .
      dockerfile: apps/ignis-server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IGNIS_PASSWORD_MIN_LENGTH: ${IGNIS_PASSWORD_MIN_LENGTH:-8}
      IGNIS_PASSWORD_MIN_SPECIAL_CHARS: ${IGNIS_PASSWORD_MIN_SPECIAL_CHARS:-0}
      IGNIS_INITIAL_ADMIN_KEY: ${IGNIS_INITIAL_ADMIN_KEY:-}
      IGNIS_PUBLIC_ORIGIN: ${IGNIS_PUBLIC_ORIGIN:-http://localhost:8080}
      IGNIS_ALLOW_HTTP_LOOPBACK: ${IGNIS_ALLOW_HTTP_LOOPBACK:-true}
      IGNIS_TRUSTED_PROXIES: ${IGNIS_TRUSTED_PROXIES:-[]}
      # match these to your host user (run: id)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:
