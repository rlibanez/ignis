<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title data-i18n="Reset password – Ignis">Reset password – Ignis</title>
  <script src="/auth/i18n.js" defer></script>
    <script src="/auth/reset-password.js" defer></script>
  <script src="/auth/password-visibility.js" defer></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/pwa/icon-512.png">
<script src="/auth/pwa.js" defer></script>
<link rel="stylesheet" href="/auth/native.css">
<link rel="stylesheet" href="/auth/entry.css">
<script src="/auth/ui-environment.js" defer></script>
<script src="/auth/entry.js" defer></script>
</head>
<body class="ignis-entry"><main>
  <p class="brand" data-ignis-app-name>IGNIS</p>
  <h1 data-i18n="Reset password">Reset password</h1>
  <form id="reset-form" hidden>
    <div class="setup-field-heading">
      <label for="reset-password" data-i18n="New password">New password</label>
      <span class="setup-field-help">
        <button type="button" class="setup-help-toggle" aria-label="About password requirements" aria-expanded="false" aria-controls="policy" data-i18n-aria-label="About password requirements">?</button>
        <span id="policy" class="setup-help-tooltip" role="tooltip" hidden></span>
      </span>
    </div>
    <input id="reset-password" aria-describedby="policy" name="password" type="password" autocomplete="new-password" required maxlength="1024" />
    <label for="reset-confirmation" data-i18n="Confirm new password">Confirm new password</label>
    <input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" required maxlength="1024" />
    <button class="mod-cta" type="submit" data-i18n="Reset password">Reset password</button>
  </form>
  <p id="reset-status" role="status" aria-live="polite" data-i18n="Checking password reset authorization…">Checking password reset authorization…</p>
  <a class="account-button secondary" href="/login" data-i18n="Back to sign in">Back to sign in</a>
</main></body>
</html>
