<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Reset password – Ignis</title>
  <link rel="stylesheet" href="/auth/setup.css" />
  <link rel="stylesheet" href="/auth/account.css" />
  <script src="/auth/reset-password.js" defer></script>
  <script src="/auth/password-visibility.js" defer></script>
</head>
<body><main>
  <p class="brand">IGNIS</p>
  <h1>Reset password</h1>
  <form id="reset-form" hidden>
    <div class="setup-field-heading">
      <label for="reset-password">New password</label>
      <span class="setup-field-help">
        <button type="button" class="setup-help-toggle" aria-label="About password requirements" aria-expanded="false" aria-controls="policy">?</button>
        <span id="policy" class="setup-help-tooltip" role="tooltip" hidden></span>
      </span>
    </div>
    <input id="reset-password" aria-describedby="policy" name="password" type="password" autocomplete="new-password" required maxlength="1024" />
    <label for="reset-confirmation">Confirm new password</label>
    <input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" required maxlength="1024" />
    <button type="submit">Reset password</button>
  </form>
  <p id="reset-status" role="status" aria-live="polite">Checking password reset authorization…</p>
  <a class="account-button secondary" href="/login">Back to sign in</a>
</main></body>
</html>
