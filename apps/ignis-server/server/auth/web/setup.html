<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up Ignis</title>
    <link rel="stylesheet" href="/auth/setup.css" />
    <script src="/auth/setup.js" defer></script>
    <script src="/auth/password-visibility.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">IGNIS</p>
      <h1>Create the first administrator</h1>
      <p id="status" role="status" aria-live="polite">Checking installation…</p>
      <noscript
        >JavaScript is required for this assistant. The operator can also use
        the local CLI.</noscript
      >
      <form id="setup-form" hidden>
        <label for="initial-key">Installation key</label>
        <input
          id="initial-key"
          name="initialAdminKey"
          type="text"
          data-masked-text
          class="masked-text"
          data-bwignore="true"
          data-1p-ignore
          data-lpignore="true"
          autocapitalize="off"
          required
          minlength="32"
          maxlength="32"
          pattern="[a-f0-9]{32}"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="setup-field-heading">
          <label for="login">Administrator username</label>
          <span class="setup-field-help">
            <button type="button" class="setup-help-toggle" aria-label="About administrator username" aria-expanded="false" aria-controls="login-help">?</button>
            <span id="login-help" class="setup-help-tooltip" role="tooltip" hidden>3–64 letters (A–Z), digits, dots, underscores or hyphens. Start with a
          letter or digit.</span>
          </span>
        </div>
        <input
          id="login"
          name="login"
          required
          minlength="3"
          maxlength="64"
          pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{2,63}"
          autocomplete="username"
          spellcheck="false"
          aria-describedby="login-help"
        />

        <div class="setup-field-heading">
          <label for="password">Password</label>
          <span class="setup-field-help">
            <button type="button" class="setup-help-toggle" aria-label="About password" aria-expanded="false" aria-controls="password-help">?</button>
            <span id="password-help" class="setup-help-tooltip" role="tooltip" hidden>Password requirements are loaded from the server.</span>
          </span>
        </div>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          maxlength="1024"
          autocomplete="new-password"
          aria-describedby="password-help"
        />

        <label for="confirmation">Confirm password</label>
        <input
          id="confirmation"
          name="passwordConfirmation"
          type="password"
          required
          minlength="8"
          maxlength="1024"
          autocomplete="new-password"
        />
        <button type="submit">Create administrator</button>
      </form>
    </main>
  </body>
</html>
