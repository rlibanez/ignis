<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="Set up Ignis">Set up Ignis</title>
    <link rel="stylesheet" href="/auth/setup.css" />
    <script src="/auth/i18n.js" defer></script>
    <script src="/auth/setup.js" defer></script>
    <script src="/auth/password-visibility.js" defer></script>
    <link rel="stylesheet" href="/auth/components.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/pwa/icon-512.png">
<script src="/auth/pwa.js" defer></script>
</head>
  <body>
    <main>
      <p class="brand" data-ignis-app-name>IGNIS</p>
      <h1 data-i18n="Create the first administrator">Create the first administrator</h1>
      <p id="status" role="status" aria-live="polite" data-i18n="Checking installation…">Checking installation…</p>
      <noscript
         data-i18n="JavaScript is required for this assistant. The operator can also use
        the local CLI.">JavaScript is required for this assistant. The operator can also use
        the local CLI.</noscript
      >
      <form id="setup-form" hidden>
        <label for="initial-key" data-i18n="Installation key">Installation key</label>
        <input
          id="initial-key"
          name="initialAdminKey"
          type="text"
          data-masked-text
          class="masked-text"
          data-bwignore="true"
          data-1p-ignore
          data-lpignore="true"
          autocapitalize="off"
          required
          minlength="32"
          maxlength="32"
          pattern="[a-f0-9]{32}"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="setup-field-heading">
          <label for="login" data-i18n="Administrator username">Administrator username</label>
          <span class="setup-field-help">
            <button type="button" class="setup-help-toggle" aria-label="About administrator username" aria-expanded="false" aria-controls="login-help" data-i18n-aria-label="About administrator username">?</button>
            <span id="login-help" class="setup-help-tooltip" role="tooltip" hidden data-i18n="3–64 letters (A–Z), digits, dots, underscores or hyphens. Start with a
          letter or digit.">3–64 letters (A–Z), digits, dots, underscores or hyphens. Start with a
          letter or digit.</span>
          </span>
        </div>
        <input
          id="login"
          name="login"
          required
          minlength="3"
          maxlength="64"
          pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{2,63}"
          autocomplete="username"
          spellcheck="false"
          aria-describedby="login-help"
        />

        <div class="setup-field-heading">
          <label for="password" data-i18n="Password">Password</label>
          <span class="setup-field-help">
            <button type="button" class="setup-help-toggle" aria-label="About password" aria-expanded="false" aria-controls="password-help" data-i18n-aria-label="About password">?</button>
            <span id="password-help" class="setup-help-tooltip" role="tooltip" hidden data-i18n="Password requirements are loaded from the server.">Password requirements are loaded from the server.</span>
          </span>
        </div>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
          maxlength="1024"
          autocomplete="new-password"
          aria-describedby="password-help"
        />

        <label for="confirmation" data-i18n="Confirm password">Confirm password</label>
        <input
          id="confirmation"
          name="passwordConfirmation"
          type="password"
          required
          minlength="8"
          maxlength="1024"
          autocomplete="new-password"
        />
        <button type="submit" data-i18n="Create administrator">Create administrator</button>
      </form>
    </main>
  </body>
</html>
