<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Ignis</title>
    <link rel="stylesheet" href="/auth/setup.css" />
    <script src="/auth/login.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">IGNIS</p>
      <h1>Sign in</h1>
      <p id="status" role="status" aria-live="polite">Checking installation…</p>
      <form id="login-form" hidden>
        <label for="login">Username</label>
        <input
          id="login"
          name="login"
          autocomplete="username"
          required
          maxlength="64"
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="1024"
        />
        <button type="submit">Sign in</button>
      </form>
      <button id="sign-out" hidden>Sign out</button>
      <noscript>JavaScript is required to sign in.</noscript>
    </main>
  </body>
</html>
