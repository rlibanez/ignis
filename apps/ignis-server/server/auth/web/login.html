<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Ignis</title>
    <link rel="stylesheet" href="/auth/setup.css" />
    <script src="/auth/login.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">IGNIS</p>
      <h1>Sign in</h1>
      <p id="status" role="status" aria-live="polite">Checking installation…</p>
      <section id="account" hidden>
        <p id="account-status"></p>
        <p><a id="open-ignis" href="/" hidden>Open Ignis</a></p>
        <button id="link-oidc" hidden>Link OpenID Connect account</button>
        <p id="link-help" class="help" hidden>
          Sign in again before linking. You will also authenticate with your
          identity provider.
        </p>
      </section>
      <form id="login-form" hidden>
        <label for="login">Username</label>
        <input
          id="login"
          name="login"
          autocomplete="username"
          required
          maxlength="64"
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="1024"
        />
        <button type="submit">Sign in</button>
      </form>
      <button id="oidc-sign-in" hidden>Sign in with OpenID Connect</button>
      <p><a id="manage-account" href="/account" hidden>Manage account</a></p>
      <button id="sign-out" hidden>Sign out</button>
      <noscript>JavaScript is required to sign in.</noscript>
    </main>
  </body>
</html>
