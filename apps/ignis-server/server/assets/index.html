<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title>Obsidian</title>
  <link href="__APP_CSS_SRC__" type="text/css" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="apple-mobile-web-app-title" content="Ignis"/>
  <link href="assets/overrides.css" type="text/css" rel="stylesheet"/>
  <style>
    #ignis-status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #202020;
      color: #b3b3b3;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
      transition: opacity 200ms ease-out;
    }
    #ignis-status.fade { opacity: 0; pointer-events: none; }
    #ignis-status img {
      width: 96px;
      height: 96px;
      animation: ignis-pulse 1.6s ease-in-out infinite;
    }
    #ignis-status-label { font-size: 13px; opacity: 0.75; }
    @keyframes ignis-pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50%      { opacity: 1;    transform: scale(1.04); }
    }
  </style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#202020">
<link rel="apple-touch-icon" href="/pwa/icon-512.png">
<script src="/auth/pwa.js" defer></script>
</head>
<body class="theme-dark">
<div id="ignis-status">
  <img src="favicon.png" alt=""/>
  <div id="ignis-status-label">Loading Obsidian...</div>
</div>
<script>window.__obsidianTerms = __OBSIDIAN_TERMS__;</script>
<!-- Ignis shims: must run before any Obsidian code. -->
<script src="/auth/i18n.js"></script>
<script src="/auth/ui-environment.js"></script>
<script src="/auth/share-store.js" defer></script>
<script src="/auth/client.js"></script>
<script src="/auth/events.js"></script>
<!-- Obsidian scripts injected dynamically to avoid touching their files. -->
<script>
(async function () {
  try {
    await window.__ignisAuth.ready;
    // OIDC sign-in returns to the app root. Resume only a share explicitly
    // selected for sign-in in this tab, after the authenticated client is ready.
    if (!location.search && window.__ignisAuth.userId) {
      let shareId;
      try {
        shareId = sessionStorage.getItem("ignis-share-sign-in");
        sessionStorage.removeItem("ignis-share-sign-in");
      } catch { /* Optional browser storage. */ }
      if (shareId && /^[A-Za-z0-9_-]{1,128}$/.test(shareId)) {
        location.replace("/share-target?" + new URLSearchParams({id: shareId}));
        return;
      }
    }
    async function load(src) {
      await new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    const uiSrc = "__IGNIS_UI_SRC__";
    const params = new URLSearchParams(location.search);
    let showManager = params.get("manager") === "1";
    if (!showManager) {
      const reference = params.get("vault") || window.__ignisAuth.rememberedVault?.();
      const response = await fetch("/api/vault/info" + (reference ? "?vault=" + encodeURIComponent(reference) : ""), { cache: "no-store" });
      if (response.status === 404) showManager = true;
      else {
        if (!response.ok) throw new Error("Vault selection unavailable");
        const info = await response.json();
        if (window.__ignisAuth.role === "user" && !info.uuid) throw new Error("Registered vault required");
        const selected = info.uuid || info.id;
        if (!selected) throw new Error("Vault identity required");
        params.set("vault", selected);
        history.replaceState(history.state, "", location.pathname + "?" + params.toString());
      }
    }
    if (showManager) {
      const environment = window.IgnisUiEnvironment;
      environment.initialize(window, { inherit: false });
      await load(uiSrc);
      document.getElementById("ignis-status")?.remove();
      window.IgnisUI.showVaultManager();
      window.IgnisUI.openRequestedManagement();
      return;
    }
    await load("__SHIM_LOADER_SRC__");
    if (window.__ignisBootstrapFailed) throw new Error("Private vault initialization unavailable");
    await load(uiSrc);
  } catch {
    window.__ignisAuth?.lock("Unable to start Ignis. Sign in again to continue.");
    return;
  }
  var scripts = __OBSIDIAN_SCRIPTS__;
  var label = document.getElementById("ignis-status-label");
  var status = document.getElementById("ignis-status");
  var loaded = 0;

  function update() {
    if (label) {
      label.textContent = "Loading Obsidian " + loaded + "/" + scripts.length;
    }
  }

  function done() {
    if (!status) return;
    status.classList.add("fade");
    setTimeout(function () {
      if (status && status.parentNode) status.parentNode.removeChild(status);
    }, 250);
  }

  function appendScripts() {
    // No Obsidian scripts to load (markup or scrape mismatch); clear the splash instead of pulsing forever.
    if (scripts.length === 0) {
      done();
      return;
    }

    update();

    for (var i = 0; i < scripts.length; i++) {
      var s = document.createElement("script");
      s.type = "text/javascript";
      s.src = scripts[i];
      s.async = false;
      s.onload = function () {
        loaded++;
        update();
        if (loaded === scripts.length) done();
      };
      s.onerror = function () {
        loaded++;
        update();
        if (loaded === scripts.length) done();
      };
      document.body.appendChild(s);
    }
  }

  // Hold Obsidian's scripts until the shim signals the priority cache slice has landed (window.__ignisBootReady), so Obsidian's early config and plugin reads hit the warm cache.
  // A timeout proceeds anyway, so a missing or never-resolving promise degrades to loading immediately instead of blocking boot.
  var ready = window.__ignisBootReady;
  if (!ready || typeof ready.then !== "function") {
    appendScripts();
    return;
  }

  var started = false;

  function start() {
    if (started) {
      return;
    }

    started = true;
    // Tell the shim's progress writer to stop touching the splash label now that we own it.
    window.__ignisBootStarted = true;
    appendScripts();
  }

  var timer = setTimeout(start, 3000);

  ready.then(
    function () {
      clearTimeout(timer);
      start();
    },
    function () {
      clearTimeout(timer);
      start();
    },
  );
})();
</script>
</body>
</html>
