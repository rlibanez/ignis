# Standalone HTTPS deployment behind an existing Traefik instance.
# Supply values via environment or --env-file. No host port is published.
services:
  ignis:
    image: rlibanez/ignis:dev
    build:
      context: ../../../..
      dockerfile: apps/ignis-server/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      IGNIS_PUBLIC_ORIGIN: https://${IGNIS_HOST:?Set IGNIS_HOST}
      IGNIS_ALLOW_HTTP_LOOPBACK: "false"
      IGNIS_ALLOW_HTTP_PRIVATE_NETWORK: "false"
      IGNIS_TRUSTED_PROXIES: ${IGNIS_TRUSTED_PROXIES:?Set the exact Traefik IP or controlled network CIDR as JSON}
      IGNIS_INITIAL_ADMIN_KEY_FILE: /run/secrets/initial_admin_key
      IGNIS_OIDC_ENABLED: "false"
    secrets:
      - initial_admin_key
    volumes:
      - ${IGNIS_VAULTS_PATH:?Set absolute vaults directory}:/vaults
      - ${IGNIS_DATA_PATH:?Set absolute data directory}:/app/data
      - obsidian-app:/app/obsidian-app
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing proxy network}
      traefik.http.routers.ignis.rule: Host(`${IGNIS_HOST}`)
      traefik.http.routers.ignis.entrypoints: websecure
      traefik.http.routers.ignis.tls: "true"
      traefik.http.routers.ignis.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Set the existing certificate resolver}
      traefik.http.services.ignis.loadbalancer.server.port: "8080"
      traefik.http.services.ignis.loadbalancer.passhostheader: "true"
      traefik.http.routers.ignis.middlewares: ignis-transport
      traefik.http.middlewares.ignis-transport.headers.stsSeconds: "31536000"
      traefik.http.middlewares.ignis-transport.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.ignis-transport.headers.referrerPolicy: no-referrer
      traefik.http.middlewares.ignis-transport.headers.frameDeny: "true"
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
volumes:
  obsidian-app:
secrets:
  initial_admin_key:
    file: ${IGNIS_INITIAL_ADMIN_KEY_HOST_FILE:?Set absolute path to the setup key file}
