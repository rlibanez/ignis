services:
  ignis:
    image: rlibanez/ignis:${IGNIS_VERSION:-1.0.0}
    build:
      context: ../..
      dockerfile: apps/ignis-server/Dockerfile
      args:
        IGNIS_VERSION: ${IGNIS_VERSION:-1.0.0}
    environment:
      IGNIS_SHARE_MAX_MIB: ${IGNIS_SHARE_MAX_MIB-32}
      IGNIS_SHARE_MAX_FILES: ${IGNIS_SHARE_MAX_FILES-100}
      IGNIS_SHARE_TTL_MINUTES: ${IGNIS_SHARE_TTL_MINUTES-60}
    ports:
      - "8082:8080"
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:
